name: Auto-delete Merged Branches (Except Starting with "a")

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-merged-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch (if not starting with "a")
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking branch: $BRANCH_NAME"
          if [[ "$BRANCH_NAME" != a* ]]; then
            echo "Deleting branch: $BRANCH_NAME"
            curl -s -X DELETE \
              -H "Authorization: token $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/$REPO/git/refs/heads/$BRANCH_NAME
          else
            echo "Branch starts with 'a' — not deleted."
          fi
